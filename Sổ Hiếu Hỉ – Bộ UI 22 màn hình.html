<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Hiếu Hỉ – Bộ UI 22 màn hình</title>
<style>
:root{--pg:#f3e2cc;--pt:#4a2a14;--pm:#8a6b4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#1d1612;--pt:#f0dcc0;--pm:#b49a80}}
:root[data-theme="dark"]{--pg:#1d1612;--pt:#f0dcc0;--pm:#b49a80}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--pt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:28px 14px 48px}
h1{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:46px;margin:0;text-align:center;background:linear-gradient(90deg,#a8741a,#e3b84f,#a8741a);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{text-align:center;color:var(--pm);font-size:14px;margin:6px auto 12px;max-width:640px}
.leg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:13px;margin-bottom:22px}.leg i{display:inline-block;width:14px;height:14px;border-radius:5px;vertical-align:-2px;margin-right:5px}
h2{text-align:center;font-size:15px;letter-spacing:1px;color:var(--pm);margin:34px 0 16px;text-transform:uppercase}
.grid{display:flex;flex-wrap:wrap;gap:30px 24px;justify-content:center}
.fig{width:288px}.cap{text-align:center;font-size:13px;margin-top:10px;color:var(--pm)}.cap b{color:var(--pt)}
.ph{--c:#fff;--rd:#a81f1a;--gd:#c9962b;--gr:#2e6b45;--tx:#33201a;--mu:#85706a;--ln:#efdfca;--pe:#fbdcc4;
 width:288px;height:600px;color:var(--tx);border:6px solid #2a1c18;border-radius:36px;overflow:hidden;position:relative;font-size:12.5px;display:flex;flex-direction:column;box-shadow:0 14px 30px #4a2a1440;
 background:radial-gradient(circle at 100% 0,#f6d9b8 0,transparent 42%),radial-gradient(circle at 0 100%,#f8e2c6 0,transparent 38%),#fdf3e6}
.ph:before{content:"";position:absolute;right:-40px;top:60px;width:130px;height:130px;border-radius:50%;border:1px solid #c9962b30;box-shadow:0 0 0 14px #c9962b10,0 0 0 28px #c9962b08;pointer-events:none}
.hd{padding:16px 14px 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;background:linear-gradient(#fbd5b6,#fdeedd);border-radius:0 0 22px 22px;position:relative}
.hd.h0{background:none;color:var(--rd);font-size:19px;font-weight:800;letter-spacing:.5px}.sp{flex:1}
.bd{flex:1;overflow:hidden;padding:12px 12px 0;position:relative}
.card{background:var(--c);border:1px solid var(--ln);border-radius:16px;padding:11px;margin-bottom:9px;box-shadow:0 3px 10px #a81f1a14}
.card.hi{background:#efebe7;border-color:#d8d0c8}
.row{display:flex;align-items:center;gap:9px}.g{flex:1;min-width:0}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#f7c9a6,#e8a07a);display:grid;place-items:center;font-weight:800;color:#7d1712;flex:none;border:2px solid #fff}
.av.hi{background:linear-gradient(135deg,#cfc7bf,#a89f96);color:#3d3630}
.ic{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#fff1dc,#f7d9b0);display:grid;place-items:center;font-size:18px;flex:none}
.t{font-weight:700;font-size:13px}.m{font-size:11px;color:var(--mu)}.a{font-weight:800;white-space:nowrap}.i{color:var(--gr)}.o{color:var(--rd)}
.sec{font-weight:800;font-size:13px;margin:6px 0 7px}
.tag{font-size:10.5px;padding:2px 9px;border-radius:99px;background:var(--pe);color:var(--rd);display:inline-block;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{padding:7px 12px;border-radius:99px;background:#f6e6cf;font-size:12px;font-weight:600}.chip.on{background:linear-gradient(135deg,#c0312a,#8a1812);color:#fff;box-shadow:0 3px 8px #a81f1a40}
.seg{display:flex;background:#f6e6cf;border-radius:99px;padding:3px;margin-bottom:10px}.seg span{flex:1;text-align:center;padding:8px;border-radius:99px;font-weight:700}.seg .on{background:linear-gradient(135deg,#c0312a,#8a1812);color:#fff}
.seg.hi .on{background:linear-gradient(135deg,#6b625a,#3d3630)}
.inp{border:1px solid var(--ln);background:#fffaf2;border-radius:13px;padding:10px 12px;color:var(--mu);margin-bottom:9px}.inp.v{color:var(--tx)}
.lb{font-size:11px;color:var(--mu);margin:2px 0 4px}
.btn{background:linear-gradient(90deg,#a81f1a,#d8a437);color:#fff;text-align:center;font-weight:800;border-radius:16px;padding:13px;margin:8px 12px 10px;box-shadow:0 6px 14px #a81f1a50;position:relative}
.btn.o{background:none;color:var(--rd);border:1.5px solid var(--rd);margin:0 0 8px;box-shadow:none}.btn.l{background:none;color:var(--mu);box-shadow:none;margin:0 12px 6px;padding:6px}
.tabs{display:flex;background:#fff;margin:0 10px 10px;border-radius:20px;padding:7px 0;box-shadow:0 4px 14px #4a2a141f}
.tabs div{flex:1;text-align:center;font-size:10.5px;color:var(--mu)}.tabs div.on{color:var(--rd);font-weight:800}.tabs span{display:block;font-size:17px}
.hero{display:flex;gap:8px;margin-bottom:10px}
.hero>div{flex:1;border-radius:18px;padding:12px;color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 14px #0003}
.hero>div:before{content:"";position:absolute;right:-16px;top:-16px;width:68px;height:68px;border:10px solid #ffffff20;border-radius:50%}
.hero small{opacity:.88;font-size:11px}.hero b{display:block;font-size:16px;margin-top:5px}
.in{background:linear-gradient(135deg,#3f9462,#1f4d33)}.out{background:linear-gradient(135deg,#c93a30,#6f130f)}
.coin{position:absolute;right:9px;bottom:8px;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#f6dc8a,#c9962b);color:#7a5200;display:grid;place-items:center;font-size:12px;font-weight:800;border:1.5px solid #fff8}
.ban{border-radius:20px;padding:15px;color:#fff;background:linear-gradient(135deg,#c0312a,#6a110d);margin-bottom:10px;position:relative;overflow:hidden;box-shadow:0 8px 18px #a81f1a55}
.ban:before{content:"";position:absolute;right:-24px;top:-24px;width:100px;height:100px;border:14px solid #ffd77a30;border-radius:50%}
.ban.hi{background:linear-gradient(135deg,#6f665e,#3a342e);box-shadow:0 8px 18px #0004}
.ban h3{margin:0 0 2px;font-size:17px}.bar{height:8px;border-radius:9px;background:#ffffff40;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f6dc8a,#e3b84f);border-radius:9px}
.big{text-align:center;font-size:32px;font-weight:800;color:var(--rd);margin:2px 0}
.tl{border-left:2px solid #e8cfae;margin-left:6px;padding-left:12px}.tl>div{position:relative;margin-bottom:11px}.tl>div:before{content:"";position:absolute;left:-19px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--gr);border:2px solid #fff}.tl>.o:before{background:var(--rd)}
.hero2{text-align:center;padding-top:28px}.env{width:92px;height:64px;margin:0 auto;border-radius:10px;background:linear-gradient(135deg,#c93a30,#8a1812);position:relative;box-shadow:0 8px 18px #a81f1a55}.env:before{content:"";position:absolute;left:0;right:0;top:0;height:34px;background:linear-gradient(135deg,#d94a3f,#a81f1a);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:10px 10px 0 0}.env:after{content:"₫";position:absolute;left:50%;top:26px;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#f6dc8a,#c9962b);color:#7a5200;display:grid;place-items:center;font-weight:800}
.hero2 h2{margin:20px 0 6px;color:var(--rd);font-size:22px;letter-spacing:0;text-transform:none}.hero2 p{color:var(--mu);margin:0 14px;line-height:1.5;font-size:13px}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0}.dots i{width:7px;height:7px;border-radius:50%;background:#e8cfae}.dots i.on{background:var(--rd);width:20px;border-radius:9px}
.pin{display:flex;gap:12px;justify-content:center;margin:16px 0}.pin i{width:14px;height:14px;border-radius:50%;border:2px solid var(--rd)}.pin i.f{background:var(--rd)}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px}.kb div{background:#fff;border-radius:14px;text-align:center;padding:11px;font-size:16px;font-weight:700;box-shadow:0 2px 6px #4a2a1414}
.sw{width:36px;height:21px;border-radius:99px;background:var(--gr);position:relative;flex:none}.sw:after{content:"";position:absolute;right:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff}.sw.off{background:#cdbfb0}.sw.off:after{right:auto;left:2px}
.tb{width:100%;border-collapse:collapse;font-size:11px}.tb td,.tb th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}.tb th{color:var(--mu)}
.bars{display:flex;align-items:flex-end;gap:7px;height:86px;margin:8px 0 4px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}.bars i{display:block;border-radius:5px 5px 0 0}.bars .p{background:linear-gradient(#4fa574,#2e6b45)}.bars .q{background:linear-gradient(#d95248,#a81f1a)}
.lab{display:flex;gap:7px;font-size:10px;color:var(--mu)}.lab span{flex:1;text-align:center}
</style></head><body>
<h1>Sổ Hiếu Hỉ</h1>
<p class="lead">Bộ UI hoàn chỉnh 22 màn hình, dựng lại với chiều sâu, gradient, hoa văn chìm và minh họa phong bì. Từ ngữ đã sửa: "Đi đám", "Phúng viếng" cho Hiếu, có Âm lịch.</p>
<div class="leg"><span><i style="background:#2e6b45"></i>Họ gửi bạn (nhận)</span><span><i style="background:#a81f1a"></i>Bạn đi đám (đi)</span><span><i style="background:#c9962b"></i>Vàng đồng</span><span><i style="background:#4a423c"></i>Hiếu (trầm)</span></div>
<div id="root"></div>
<script>
const T=n=>{const t=[["🏠","Trang chủ"],["📅","Sự kiện"],["👥","Người quen"],["📊","Thống kê"]];return `<div class="tabs">${t.map((x,i)=>`<div class="${i===n?"on":""}"><span>${x[0]}</span>${x[1]}</div>`).join("")}</div>`};
const hd=(t,r="")=>`<div class="hd">‹ <span>${t}</span><span class="sp"></span>${r}</div>`;
const h0=(t,r="")=>`<div class="hd h0">${t}<span class="sp"></span>${r}</div>`;
const row=(n,s,a="",c="",h="")=>`<div class="card ${h} row"><div class="av ${h}">${n.trim()[0]}</div><div class="g"><div class="t">${n}</div><div class="m">${s}</div></div><div class="a ${c}">${a}</div></div>`;
const opt=(i,t,s)=>`<div class="card row"><div class="ic">${i}</div><div class="g"><div class="t">${t}</div><div class="m">${s}</div></div>›</div>`;
const tg=(t,s)=>`<div class="card row"><div class="g"><div class="t">${t}</div>${s?`<div class="m">${s}</div>`:""}</div><div class="sw"></div></div>`;
const P=(c,s,h,b,f="")=>`<div class="fig"><div class="ph">${h}<div class="bd">${b}</div>${f}</div><div class="cap"><b>${c}</b><br>${s}</div></div>`;
const bt=t=>`<div class="btn">${t}</div>`;
const G=(title,arr)=>`<h2>${title}</h2><div class="grid">${arr.join("")}</div>`;
const ob=(n,h,p)=>P(`${n+1}. Giới thiệu ${n+1}/3`,"Có thể bỏ qua","",`<div class="hero2"><div class="env"></div><h2>${h}</h2><p>${p}</p></div><div class="dots">${[0,1,2].map(i=>`<i class="${i===n?"on":""}"></i>`).join("")}</div>`,bt(n===2?"Bắt đầu":"Tiếp tục")+`<div class="btn l">Bỏ qua</div>`);
const A=[
ob(0,"Nhớ ai đã gửi mình","Ghi lại mỗi khoản mừng, phúng viếng theo từng người, để đi đám không còn lúng túng."),
P("2. Tạo mã PIN","Bảo vệ dữ liệu",hd("Bảo mật"),`<div class="hero2" style="padding-top:12px"><div class="ic" style="margin:0 auto;width:54px;height:54px;font-size:26px">🔒</div><h2 style="margin-top:12px">Đặt mã PIN 4 số</h2><p>Chỉ bạn mới mở được sổ</p></div><div class="pin"><i class="f"></i><i class="f"></i><i></i><i></i></div><div class="kb"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div><div>👆</div><div>0</div><div>⌫</div></div>`),
P("3. Gợi ý nhập dữ liệu cũ","Giải quyết sổ trống",hd("Bắt đầu"),`<div class="hero2" style="padding-top:12px"><div class="env" style="transform:scale(.8)"></div><h2>Bạn đã có sổ cũ?</h2><p>Nhập các khoản đã ghi để có đủ lịch sử ngay hôm nay.</p></div><div style="height:14px"></div>${opt("📋","Dán danh sách","Nhanh nhất, từ ghi chú hoặc Zalo")}${opt("📊","Nhập từ Excel/CSV","Từ file bạn đang dùng")}`,`<div class="btn l">Để sau, bắt đầu từ sổ trống</div>`)
];
const B=[
P("4. Trang chủ","Hôm nay có ai cần nhớ không?",h0("SỔ HIẾU HỈ","🔍 🔒"),`<div class="hero"><div class="in"><small>Đã nhận năm nay</small><b>32.500.000đ</b><span class="coin">₫</span></div><div class="out"><small>Đã đi đám năm nay</small><b>8.000.000đ</b><span class="coin">₫</span></div></div><div class="card" style="background:linear-gradient(135deg,#fbd9bd,#fde9d4)"><div class="t">🔔 Sắp tới · 20/10 (âm 9/9)</div><div class="m" style="color:var(--tx)">Đám cưới Hùng – Mai. Lần trước họ gửi bạn <b>500.000đ</b></div></div><div class="sec">Gần đây</div>${row("Cô Hạnh","Đám cưới con gái · hôm qua","+1.000.000đ","i")}${row("Anh Long","Tân gia · 3 ngày trước","−500.000đ","o")}${row("Chú Ba","Giỗ cụ · tuần trước","+500.000đ","i")}`,T(0)),
P("5. Danh sách sự kiện","Hỉ đỏ, Hiếu tông trầm",h0("Sự kiện","＋"),`<div class="seg"><span class="on">Nhà tôi tổ chức</span><span>Tôi đi dự</span></div>${row("Đám cưới con gái","12/05/2026 · 36 khách","15.000.000đ","i")}${row("Thôi nôi bé Bông","20/03/2026 · 18 khách","6.500.000đ","i")}${row("Giỗ ông nội","Âm 8/8 · 12 người phúng","3.000.000đ","i","hi")}${row("Tân gia nhà mới","10/01/2026 · 25 khách","9.000.000đ","i")}`,T(1)),
P("6. Chi tiết sự kiện","Nhà bạn tổ chức",hd("Sự kiện"),`<div class="ban"><h3>Đám cưới con gái</h3><div style="opacity:.85">12/05/2026 · Âm 16/4</div><div style="margin-top:10px">Đã nhận <b>15.000.000đ</b> · 36/48 khách</div><div class="bar"><i style="width:75%"></i></div></div><div class="inp">🔍 Tìm khách...</div>${row("Nguyễn Văn B","Bạn đại học · mâm 5","1.000.000đ","i")}${row("Chị Lan","Đồng nghiệp · mâm 3","500.000đ","i")}${row("Chú Ba","Họ hàng · quà hiện vật","—","i")}`,bt("＋ Ghi khách mừng")),
P("7. Người quen","Tìm không dấu vẫn ra",h0("Người quen","＋"),`<div class="inp">🔍 nguyen van b...</div><div class="chips"><span class="chip on">Tất cả</span><span class="chip">Họ hàng</span><span class="chip">Bạn bè</span><span class="chip">Đồng nghiệp</span></div>${row("Nguyễn Văn B","Bạn đại học · 4 lần qua lại")}${row("Cô Hạnh","Họ hàng · gần nhất: hôm qua")}${row("Chị Lan","Đồng nghiệp · 2 lần")}${row("Chú Ba","Họ hàng · 7 lần")}`,T(2)),
P("8. Hồ sơ người quen","Lịch sử, không phải sổ nợ",hd("Hồ sơ"),`<div style="text-align:center;margin-bottom:8px"><div class="av" style="width:54px;height:54px;margin:0 auto 4px;font-size:21px">B</div><div class="t" style="font-size:15px">Nguyễn Văn B</div><span class="tag">Bạn đại học</span></div><div class="hero"><div class="in"><small>Họ đã gửi bạn</small><b>2.500.000đ</b></div><div class="out"><small>Bạn đã đi đám</small><b>1.500.000đ</b></div></div><div class="sec">Lịch sử qua lại</div><div class="tl"><div><div class="t">2026 · Đám cưới bạn</div><div class="m">Họ mừng 1.000.000đ</div></div><div class="o"><div class="t">2025 · Tân gia</div><div class="m">Bạn mừng 500.000đ</div></div></div><div class="card"><div class="m">Ghi nhớ</div>Con gái tên Bông, thích cà phê</div>`,bt("＋ Ghi thêm")),
P("9. Ghi nhanh","Chỉ bắt buộc: tên + tiền",hd("Ghi khoản mừng"),`<div class="seg"><span class="on">Họ gửi bạn</span><span>Bạn đi đám</span></div><div class="big">500.000đ</div><div class="chips" style="justify-content:center"><span class="chip">100k</span><span class="chip">200k</span><span class="chip on">500k</span><span class="chip">1 triệu</span><span class="chip">2 triệu</span></div><div class="inp v">🔍 Chú Ba</div><div class="lb">Dịp</div><div class="chips" style="margin-top:0"><span class="chip on">Cưới</span><span class="chip">Tân gia</span><span class="chip">Đầy tháng</span><span class="chip">Tang lễ</span></div><div class="inp" style="height:50px">Ghi chú: mâm số 5</div>`,bt("Lưu vào sổ")),
P("10. Chi tiết khoản","Xem, sửa, xóa",hd("Chi tiết khoản","✎"),`<div class="ban in" style="text-align:center;background:linear-gradient(135deg,#3f9462,#1f4d33)"><div style="opacity:.85">Họ gửi bạn</div><div style="font-size:28px;font-weight:800;margin:4px 0">1.000.000đ</div><span class="tag">💍 Cưới</span></div>${row("Nguyễn Văn B","Bạn đại học")}<div class="card"><div class="m">Sự kiện</div>Đám cưới con gái · 12/05/2026</div><div class="card"><div class="m">Ghi chú</div>Mâm số 5, kèm quà hiện vật</div><div class="card"><div class="m">Lần trước bạn mừng họ</div>500.000đ · Tân gia 2025</div>`,`<div class="btn o" style="margin:0 12px 10px">Xóa khoản này</div>`),
P("11. Tìm kiếm","Tên, dịp, số tiền, năm",hd("Tìm kiếm"),`<div class="inp v" style="border-color:var(--rd)">🔍 500000</div><div class="chips"><span class="chip on">Tất cả</span><span class="chip">Người</span><span class="chip">Sự kiện</span><span class="chip">Khoản</span></div><div class="sec">Khoản 500.000đ · 6 kết quả</div>${row("Chú Ba","Giỗ cụ · 2024","+500.000đ","i")}${row("Anh Long","Tân gia · 2025","−500.000đ","o")}${row("Chị Lan","Thôi nôi · 2026","+500.000đ","i")}${row("Anh Tuấn","Cưới · 2023","−500.000đ","o")}`),
P("12. Thêm người quen","Chỉ bắt buộc: tên",hd("Thêm người"),`<div style="text-align:center;margin-bottom:10px"><div class="av" style="width:56px;height:56px;margin:0 auto;font-size:22px">📷</div></div><div class="lb">Tên</div><div class="inp v">Nguyễn Văn B</div><div class="lb">Tên hay gọi (tùy chọn)</div><div class="inp">Thằng B, anh Bê...</div><div class="lb">Quan hệ</div><div class="chips" style="margin-top:0"><span class="chip">Họ hàng</span><span class="chip on">Bạn bè</span><span class="chip">Đồng nghiệp</span><span class="chip">＋ Khác</span></div><div class="lb">Sinh nhật (tùy chọn)</div><div class="inp">12/11 · Dương lịch</div>`,bt("Lưu"))
